name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (lint + test)
    runs-on: ubuntu-latest
    services:
      # Not strictly required by the current test suite (none of it exercises
      # a code path that touches Redis yet - see the test-priorities note in
      # the PR description), but matching the real docker-compose topology
      # here means future tests that do need it (e.g. a full authenticated
      # submit-project flow) won't require a workflow change to add it.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            worker/requirements.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Test (pytest)
        run: pytest backend/tests/ -v
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  worker:
    name: worker (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            worker/requirements.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check worker/

      - name: Test (pytest)
        # worker/pytest.ini adds worker/ itself to sys.path, matching how
        # worker/main.py's unqualified imports (`from config import
        # settings`) resolve when the process is run directly - that only
        # works with worker/ as the working directory, not the repo root.
        working-directory: worker
        run: pytest -v

  frontend:
    name: frontend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Test (jest via react-scripts)
        working-directory: frontend
        run: npm test -- --watchAll=false
        env:
          CI: true
