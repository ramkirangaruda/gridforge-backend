# GridForge local stack: redis -> backend -> worker (spawns gridforge-exec
# sandbox containers) -> frontend.
#
# Requires a .env file at the repo root (see .env.example) - in particular
# HOST_UPLOADS_DIR, which MUST be the absolute path of ./uploads on the
# HOST machine. See the comment on the worker service below for why.

# Fields backend and worker MUST agree on for tasks to flow at all -
# defined once here and merged into both services' `environment:` below
# via the `<<: *shared-env` YAML anchor, so this file itself can't
# specify two different literal values for them (the risk a plain
# copy-pasted block per service would carry). This is the compose-layer
# half of the fix; shared/config.py is the equivalent at the Python
# source level, and worker/main.py's startup ping to the backend is the
# runtime check that catches drift even when neither of those apply.
x-shared-env: &shared-env
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_QUEUE_NAME: gridforge_tasks
  WORKER_API_KEY: ${WORKER_API_KEY:?Set WORKER_API_KEY in .env}

# Memory/CPU ceilings for the always-on services, sized for a small VM
# (1-2 vCPU, 1-2GB RAM - e.g. a Hetzner CX22 or DO Basic droplet). These
# are LIMITS, not reservations: Docker enforces memory limits as a hard
# cap (exceeding it gets the container OOM-killed, so these must actually
# fit in physical RAM), but CPU limits are just a ceiling on how much of
# a core a container can use when it wants more, not a guarantee - it's
# fine (and normal) for CPU limits across containers to sum to more than
# the host's core count, since they only bite under real contention.
#
# Math worth knowing: redis + backend + worker limits below total 896MB.
# The worker ALSO spawns a separate sandbox container per task with its
# own 512MB limit (DOCKER_MEM_LIMIT below) - so one task running
# concurrently with the three base services at their ceiling is ~1.4GB,
# plus OS/dockerd overhead. That does NOT comfortably fit a 1GB box; it
# does fit a 2GB one with some room to spare. On a strict 1GB VM, lower
# DOCKER_MEM_LIMIT (currently 512m) and/or the limits below before
# relying on this in production.
x-small-limits: &small-limits
  memory: 384M
  cpus: "0.5"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          # Redis itself is lightweight here - it's only ever holding a
          # handful of task IDs in a list plus a few pub/sub subscribers,
          # nowhere near what would need 384M.
          memory: 128M
          cpus: "0.5"
    restart: unless-stopped

  # Builds and tags the gridforge-exec:latest sandbox image from
  # worker/Dockerfile. This service never stays running - `entrypoint: true`
  # makes the container exit 0 immediately after the image is built/tagged,
  # and `worker` waits on it via `condition: service_completed_successfully`.
  # This is the "build it as part of compose" answer to the chicken-and-egg
  # problem: worker refuses to run tasks until gridforge-exec:latest exists.
  gridforge-exec-image:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: gridforge-exec:latest
    entrypoint: ["true"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *shared-env
      API_PORT: 8000
      UPLOADS_DIR: /app/uploads
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
    volumes:
      - ${HOST_UPLOADS_DIR:?Set HOST_UPLOADS_DIR in .env to the absolute host path of ./uploads}:/app/uploads
    healthcheck:
      # No curl/wget in python:3.11-slim, so this uses the stdlib instead
      # of adding an apt package just for a healthcheck. An unreachable/
      # non-200 /health raises inside this script, which is exactly the
      # nonzero exit Docker wants to see for "unhealthy" - no explicit
      # try/except needed.
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits: *small-limits
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile.worker
    environment:
      <<: *shared-env
      API_BASE_URL: http://backend:8000/api/v1
      DOCKER_IMAGE: gridforge-exec:latest
      DOCKER_TIMEOUT: 300
      DOCKER_MEM_LIMIT: 512m
      DOCKER_CPU_LIMIT: 1.0
      # MUST equal the mount source below verbatim (not the backend's
      # in-container /app/uploads). docker_runner.py passes this path
      # straight to the Docker SDK as a bind-mount source for the
      # sandbox container it spawns. Since that call goes over the
      # host Docker socket, the HOST daemon resolves the path - it
      # knows nothing about this container's own filesystem. Mounting
      # the host uploads dir at its own identical path inside the
      # worker container ("path mirroring") keeps both sides in sync
      # without needing to patch worker source to translate paths.
      WORKSPACES_DIR: ${HOST_UPLOADS_DIR:?Set HOST_UPLOADS_DIR in .env to the absolute host path of ./uploads}
    volumes:
      - ${HOST_UPLOADS_DIR:?Set HOST_UPLOADS_DIR in .env to the absolute host path of ./uploads}:${HOST_UPLOADS_DIR:?Set HOST_UPLOADS_DIR in .env to the absolute host path of ./uploads}
      # Grants the worker control of the HOST Docker daemon so it can
      # spawn/inspect/remove sandbox containers as siblings (not
      # children) of itself. See the "Docker socket" note in the PR
      # description / README for the security tradeoff and a hardened
      # alternative (routing through docker-socket-proxy instead of
      # mounting the raw socket).
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        # Only the worker PROCESS itself, not the sandbox containers it
        # spawns - those get their own separate limits below
        # (DOCKER_MEM_LIMIT/DOCKER_CPU_LIMIT), enforced by docker_runner.py
        # on each task container individually. The worker process itself
        # just polls Redis and makes HTTP/Docker-SDK calls - it doesn't
        # need much.
        limits: *small-limits
    depends_on:
      redis:
        condition: service_healthy
      backend:
        # service_started only confirms the container process launched,
        # not that uvicorn is actually accepting connections - worker's
        # first requests could otherwise race a backend that's still
        # importing modules/initializing the DB. service_healthy waits
        # for backend's own healthcheck above (GET /health) to pass first.
        condition: service_healthy
      gridforge-exec-image:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # This is read by code running in the user's BROWSER, not inside
      # this container - it must be a URL the host machine can reach
      # (the published port below), never the internal service name
      # `backend` (that's only resolvable on the compose network).
      REACT_APP_API_URL: http://localhost:8000
      WDS_SOCKET_PORT: 0
    depends_on:
      backend:
        condition: service_started
