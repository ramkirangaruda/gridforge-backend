[pytest]
; worker/*.py uses unqualified imports (`from config import settings`),
; expecting worker/ itself to be on sys.path rather than being imported as
; a `worker.*` package - this makes pytest add worker/ (this file's
; directory) to sys.path so those imports resolve the same way they do
; when the worker process is run directly (`python worker/main.py`).
pythonpath = .
testpaths = tests
